# Static file server for the build output.
#
# The container may be started with an arbitrary UID, so every path nginx writes to
# lives under /tmp and the error log goes to the already-open stderr.
worker_processes 4;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    # Requests are already recorded by the reverse proxy in front of this server.
    access_log off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # A reverse proxy sends HTTP/1.0 requests unless told otherwise, and nginx only
    # compresses HTTP/1.1 responses to direct clients by default.
    gzip on;
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    server {
        listen 3000;
        root /usr/share/nginx/html;
        absolute_redirect off;

        # File names carry a content hash, so a response never goes stale. A missing file
        # must be a 404: answering with the SPA shell would put HTML under a script URL,
        # and this location tells clients to keep whatever they receive.
        location /search/assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Every other path below /search is a client-side route of the SPA.
        location = /search {
            try_files /search/index.html =404;
            add_header Cache-Control "no-cache";
        }

        location /search/ {
            try_files $uri /search/index.html;
            add_header Cache-Control "no-cache";
        }

        # The root holds a plain landing page, not the SPA. Unknown paths here are a 404
        # rather than a fallback to either HTML file.
        location / {
            try_files $uri $uri/index.html =404;
            add_header Cache-Control "no-cache";
        }
    }
}
