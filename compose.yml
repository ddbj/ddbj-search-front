services:
  front:
    build:
      context: .
      target: runtime
      args:
        VITE_API_PATH: ${VITE_API_PATH}
        VITE_DEPLOYMENT_ENV: ${VITE_DEPLOYMENT_ENV:-LIVE}
    image: ddbj-search-front-${DDBJ_SEARCH_ENV}
    container_name: ddbj-search-front-${DDBJ_SEARCH_ENV}
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    networks:
      - ddbj-search-network
    restart: unless-stopped
    # Per-container log rotation. The journald driver keeps a single shared
    # budget across every container, so one chatty service evicts the logs of
    # all the others. "json-file" is the one driver name both Docker and
    # Podman accept.
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "5"
    init: true

networks:
  ddbj-search-network:
    name: ddbj-search-network-${DDBJ_SEARCH_ENV}
    external: true
