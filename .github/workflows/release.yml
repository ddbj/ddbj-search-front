name: release

on:
  push:
    tags:
      - "20*" # yyyymmdd

jobs:
  create_gh_release:
    if: github.repository == 'ddbj/ddbj-search-front'
    runs-on: ubuntu-22.04
    steps:
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release \
            --repo "$GITHUB_REPOSITORY" \
            create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes
